<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeFiWeb3.io - Crypto, Web3 & DeFi Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* Reset and Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Exo 2', sans-serif;
        }

        body {
            background-color: #0a0a1a;
            color: #e0e0e0;
            line-height: 1.6;
            position: relative;
            overflow-x: hidden;
            transition: background-color 0.3s, color 0.3s;
            scroll-behavior: smooth;
        }

        /* Blockchain Background Animation */
        .background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
            background: linear-gradient(135deg, #0a0a1a, #1a1a3d);
        }

        .background::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, rgba(0, 209, 178, 0.3) 0%, transparent 70%);
            animation: pulse 10s infinite;
        }

        .background::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMTAwIiBoZWlnaHQ9Ijg2LjYiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+PHBhdGggZD0iTTUwIDBMIDAgNDMuM0wgMCA4Ni42TCA1MCA4Ni42TCAxMDAgNDMuM0wgMTAwIDB6IiBzdHJva2U9IiMwMEQxQjIiIGZpbGw9Im5vbmUiLz48bGluZSB4MT0iNTAiIHkxPSIwIiB4Mj0iMCIgeTI9IjQzLjMiIHN0cm9rZT0iIzAwRDFCMiIvPjpsaW5lIHgxPSI1MCIgeTE9IjAiIHgyPSIxMDAiIHkyPSI0My4zIiBzdHJva2U9IiMwMEQxQjIiLz48bGluZSB4MT0iMCIgeTE9IjQzLjMiIHgyPSI1MCIgeTI9Ijg2LjYiIHN0cm9rZT0iIzAwRDFCMiIvPjpsaW5lIHgxPSIxMDAiIHkxPSI0My4zIiB4Mj0iNTAiIHkyPSI4Ni42IiBzdHJva2U9IiMwMEQxQjIiLz48bGluZSB4MT0iMCIgeTE9IjQzLjMiIHgyPSIxMDAiIHkyPSI0My4zIiBzdHJva2U9IiMwMEQxQjIiLz48L3N2Zz4=');
            background-repeat: repeat;
            opacity: 0.2;
        }

        .background .particle {
            position: absolute;
            background: #00D1B2;
            border-radius: 50%;
            opacity: 0.6;
            animation: float 15s infinite linear;
        }

        .particle:nth-child(1) { width: 8px; height: 8px; top: 20%; left: 10%; animation-duration: 20s; }
        .particle:nth-child(2) { width: 6px; height: 6px; top: 50%; left: 30%; animation-duration: 25s; }
        .particle:nth-child(3) { width: 7px; height: 7px; top: 70%; left: 60%; animation-duration: 18s; }
        .particle:nth-child(4) { width: 9px; height: 9px; top: 30%; left: 80%; animation-duration: 22s; }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.3; }
            50% { transform: scale(1.2); opacity: 0.5; }
            100% { transform: scale(1); opacity: 0.3; }
        }

        @keyframes float {
            0% { transform: translate(0, 0); }
            100% { transform: translate(100vw, -100vh); }
        }

        /* Header and Navigation */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: linear-gradient(90deg, #1a1a3d, #2a2a5e);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            transition: all 0.3s ease;
        }

        header.scrolled {
            background: linear-gradient(90deg, #1a1a3d, #2a2a5e);
            opacity: 0.95;
        }

        .logo {
            font-size: 1.5rem;
            color: #00D1B2;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 2rem;
        }

        nav ul li a {
            color: #e0e0e0;
            text-decoration: none;
            transition: color 0.3s;
        }

        nav ul li a:hover {
            color: #00D1B2;
        }

        /* Hamburger Menu */
        .hamburger {
            display: none;
            flex-direction: column;
            cursor: pointer;
        }

        .hamburger span {
            width: 25px;
            height: 3px;
            background: #e0e0e0;
            margin: 4px 0;
            transition: 0.3s;
        }

        /* Mobile Menu */
        @media (max-width: 768px) {
            nav ul {
                position: absolute;
                top: 60px;
                left: 0;
                width: 100%;
                background: linear-gradient(90deg, #1a1a3d, #2a2a5e);
                flex-direction: column;
                gap: 1rem;
                padding: 1rem;
                display: none;
            }

            nav ul.active {
                display: flex;
            }

            .hamburger {
                display: flex;
            }
        }

        /* Hero Section */
        .hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 2rem;
            padding-top: 80px;
            animation: fadeIn 2s ease-out;
        }

        .hero h1 {
            font-size: 3rem;
            color: #00D1B2;
            margin-bottom: 1rem;
            text-shadow: 0 0 10px #00D1B2;
        }

        .hero p {
            font-size: 1.2rem;
            max-width: 600px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(50px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Glossary Section */
        .glossary {
            padding: 4rem 2rem;
            background: rgba(255, 255, 255, 0.05);
            transition: all 0.5s ease;
        }

        .glossary h2 {
            text-align: center;
            font-size: 2.5rem;
            color: #00D1B2;
            margin-bottom: 2rem;
            animation: fadeIn 1s ease-out 0.5s both;
        }

        /* Search Bar with Autocomplete */
        .search-container {
            max-width: 600px;
            margin: 0 auto 2rem;
            position: relative;
        }

        #search-input {
            width: 100%;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid #00D1B2;
            color: #e0e0e0;
            border-radius: 5px;
            font-size: 1rem;
        }

        #autocomplete-list {
            position: absolute;
            width: 100%;
            background: #1a1a3d;
            border: 1px solid #00D1B2;
            border-top: none;
            max-height: 200px;
            overflow-y: auto;
            z-index: 10;
            display: none;
        }

        .autocomplete-item {
            padding: 1rem;
            cursor: pointer;
            transition: background 0.3s;
        }

        .autocomplete-item:hover {
            background: rgba(0, 209, 178, 0.2);
        }

        /* Glossary List */
        #glossary-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
        }

        .term {
            background: #1a1a3d;
            padding: 1.5rem;
            border-radius: 10px;
            border: 1px solid #00D1B2;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .term:hover {
            transform: translateY(-5px);
            box-shadow: 0 0 15px #00D1B2;
        }

        .term h3 {
            color: #00D1B2;
            margin-bottom: 0.5rem;
        }

        /* Smooth Scroll Effects */
        section {
            opacity: 0;
            transform: translateY(50px);
            transition: opacity 1s, transform 1s;
        }

        section.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 2rem;
            background: #1a1a3d;
            color: #888;
        }
    </style>
</head>
<body>
    <div class="background">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
    </div>

    <header>
        <div class="logo">DeFiWeb3.io</div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="crypto-defi-web3-glossary.html">Glossary</a></li>
                <li><a href="crypto-defi-web3-news.html">News</a></li>
            </ul>
        </nav>
        <div class="hamburger">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </header>

    <main>
        <section id="hero" class="hero">
            <h1>Crypto, Web3 & DeFi Hub</h1>
            <p>Explore the future of decentralized finance, crypto ecosystems and enhance your knowledge.</p>
        </section>
    </main>

    <footer>
        &copy; 2025 DeFiWeb3.io - All Rights Reserved
    </footer>

    <script>
        // Hamburger Menu Toggle
        const hamburger = document.querySelector('.hamburger');
        const navUl = document.querySelector('nav ul');

        hamburger.addEventListener('click', () => {
            navUl.classList.toggle('active');
            hamburger.classList.toggle('active');
        });

        // Scrolled Header
        window.addEventListener('scroll', () => {
            if (window.scrollY > 50) {
                document.querySelector('header').classList.add('scrolled');
            } else {
                document.querySelector('header').classList.remove('scrolled');
            }
        });

        // Smooth Scroll Effects with Intersection Observer
        const sections = document.querySelectorAll('section');
        const observer = new IntersectionObserver(entries => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                }
            });
        }, { threshold: 0.1 });

        sections.forEach(section => observer.observe(section));
    </script>
</body>
</html>
